{% extends "base.html" %}
{% block title %}تسجيل الدخول{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('home') }}">&rarr; رجوع</a>
<h1>تسجيل الدخول</h1>
<p class="subtitle">شوف تبرعاتك السابقة واستخدم اسم مستعار محفوظ</p>

<form method="POST">
  <label>رقم التليفون</label>
  <input type="tel" name="phone" value="{{ form.get('phone', '') }}" required>

  <label class="checkbox-label" style="margin-top:14px;">
    <input type="checkbox" name="remember_me" checked> افتكرني على الجهاز ده
  </label>

  <button type="submit">استمرار</button>
</form>

<style>
  .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #333; }
  .checkbox-label input { width: auto; }
</style>
{% endblock %}
